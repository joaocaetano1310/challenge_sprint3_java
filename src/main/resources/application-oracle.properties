spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
# Ative apenas após revisão de docs/ORACLE.md e backup.
spring.flyway.enabled=${DB_MIGRATIONS_ENABLED:false}
spring.flyway.baseline-on-migrate=${DB_EXISTENTE:false}
spring.flyway.baseline-version=1
server.servlet.session.cookie.secure=${HTTPS_ENABLED:false}
