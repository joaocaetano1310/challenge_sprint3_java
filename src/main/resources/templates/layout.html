<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${titulo}+' · FutureVet'">FutureVet</title>
<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside th:fragment="nav" class="sidebar">
<a class="brand" th:href="@{/}">
<span class="brand-icon">✚</span> FutureVet<span class="brand-dot">.</span>
</a>
<div class="nav-label">CUIDADO CONTÍNUO</div>
<nav aria-label="Menu principal">
<a th:href="@{/}">◫ <span>Visão geral</span>
</a>
<a th:href="@{/animais}">♡ <span>Animais</span>
</a>
<a th:href="@{/consultas}">▦ <span>Consultas</span>
</a>
<a th:href="@{/vacinas}">✓ <span>Carteira de vacinação</span>
</a>
<a th:if="${usuario != null and usuario.admin()}" th:href="@{/admin/usuarios}">◎ <span>Tutores e equipe</span>
</a>
</nav>
<div class="sidebar-note">
<strong>Cuidar hoje.<br>Viver melhor amanhã.</strong>
<p>Uma jornada de saúde para cada pet.</p>
</div>
<div class="account" th:if="${usuario != null}">
<strong th:text="${usuario.nome}">
</strong>
<small th:text="${usuario.admin() ? 'Equipe da clínica' : 'Tutor'}">
</small>
<form th:action="@{/logout}" method="post">
<button class="logout">Sair da conta ↗</button>
</form>
</div>
</aside>
<div th:fragment="alerts">
<div class="alert success" role="status" th:if="${sucesso}" th:text="${sucesso}">
</div>
<div class="alert danger" role="alert" th:if="${erro}" th:text="${erro}">
</div>
</div>
<div th:fragment="errors" class="alert danger" role="alert" th:if="${#fields.hasErrors('*')}">
<strong>Confira os dados:</strong>
<ul>
<li th:each="e:${#fields.errors('*')}" th:text="${e}">
</li>
</ul>
</div>
</body>
</html>
