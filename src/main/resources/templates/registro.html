<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Criar conta')}">
</head>
<body class="register">
<main class="register-card">
<a class="brand" th:href="@{/login}">✚ FutureVet.</a>
<h1>O primeiro passo é cuidar.</h1>
<p>Crie sua conta de tutor. Depois, cadastre seus animais.</p>
<form th:action="@{/registro}" method="post" th:object="${form}">
<div th:replace="~{layout :: errors}">
</div>
<div class="form-grid">
<label>Nome completo<input type="text" th:field="*{nome}" required maxlength="50" autocomplete="name">
</label>
<label>E-mail<input type="email" th:field="*{email}" required maxlength="50" autocomplete="email">
</label>
<label>CPF<input type="text" th:field="*{cpf}" required placeholder="000.000.000-00" maxlength="14">
</label>
<label>Telefone (opcional)<input type="text" th:field="*{telefone}" placeholder="(11) 99999-9999" maxlength="20">
</label>
<label>Senha (8 a 60 caracteres)<input type="password" th:field="*{senha}" required minlength="8" maxlength="60" autocomplete="new-password">
</label>
<label>Confirme sua senha<input type="password" th:field="*{confirmacao}" required autocomplete="new-password">
</label>
</div>
<button class="button wide">Criar minha conta →</button>
</form>
<p>Já tem uma conta? <a th:href="@{/login}">Entrar</a>
</p>
</main>
</body>
</html>
