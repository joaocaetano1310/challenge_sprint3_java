<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Agendar ou reagendar consulta')}">
</head>
<body>
<aside th:replace="~{layout :: nav}">
</aside>
<main class="main">
<div th:replace="~{layout :: alerts}">
</div>
<header class="page-header">
<div>
<div class="eyebrow">CUIDADO EM CADA DETALHE</div>
<h1>Agendar ou reagendar consulta</h1>
<p>Preencha as informações abaixo. Os campos opcionais estão identificados.</p>
</div>
</header>
<section class="panel form-panel">
<form th:action="@{/consultas/salvar}" method="post" th:object="${form}">
<div th:replace="~{layout :: errors}">
</div>
<input th:if="${id != null}" type="hidden" name="id" th:value="${id}">
<p class="form-tip">Segunda a sábado, das 08:00 às 18:00. A clínica confirma a solicitação. Ao reagendar, o animal original é mantido.</p>
<div class="form-grid">
<label>Animal<select th:field="*{animalId}" required>
<option value="">Selecione</option>
<option th:each="a:${animais}" th:value="${a.id}" th:text="${a.nome}+' · '+${a.tutor}">
</option>
</select>
</label>
<label>Tipo de consulta<input type="text" th:field="*{tipo}" required maxlength="30" placeholder="Ex.: Consulta preventiva">
</label>
<label>Data<input type="date" th:field="*{data}" required>
</label>
<label>Horário<input type="time" th:field="*{hora}" required min="08:00" max="18:00" step="60">
</label>
<label>Local / consultório<input type="text" th:field="*{local}" required maxlength="100" placeholder="Ex.: Consultório 1">
</label>
<label>Observações (opcional)<textarea th:field="*{observacao}" maxlength="255">
</textarea>
</label>
</div>
<div class="form-actions">
<a class="button secondary" th:href="@{/consultas}">Voltar</a>
<button class="button">Salvar e continuar →</button>
</div>
</form>
</section>
<footer>FutureVet · Cuidado que acompanha a vida.</footer>
</main>
</body>
</html>
