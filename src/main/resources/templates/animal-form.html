<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Perfil do animal')}">
</head>
<body>
<aside th:replace="~{layout :: nav}">
</aside>
<main class="main">
<div th:replace="~{layout :: alerts}">
</div>
<header class="page-header">
<div>
<div class="eyebrow">CUIDADO EM CADA DETALHE</div>
<h1>Perfil do animal</h1>
<p>Preencha as informações abaixo. Os campos opcionais estão identificados.</p>
</div>
</header>
<section class="panel form-panel">
<form th:action="@{/animais/salvar}" method="post" th:object="${form}">
<div th:replace="~{layout :: errors}">
</div>
<input th:if="${id != null}" type="hidden" name="id" th:value="${id}">
<div class="form-grid">
<label>Nome<input type="text" th:field="*{nome}" required maxlength="30">
</label>
<label>Espécie<select th:field="*{especie}" required>
<option value="">Selecione</option>
<option value="CAO">Cão</option>
<option value="GATO">Gato</option>
<option value="COELHO">Coelho</option>
<option value="OUTRO">Outro</option>
</select>
</label>
<label>Raça (opcional)<input type="text" th:field="*{raca}" maxlength="35">
</label>
<label>Idade (opcional)<input type="text" th:field="*{idade}" maxlength="30" placeholder="Ex.: 6 meses ou 2 anos">
</label>
<label>Porte (opcional)<select th:field="*{porte}">
<option value="">Não informado</option>
<option value="PEQUENO">Pequeno</option>
<option value="MEDIO">Médio</option>
<option value="GRANDE">Grande</option>
</select>
</label>
<label>Peso em kg (opcional)<input type="number" th:field="*{peso}" step="0.01" min="0.01" max="999.99">
</label>
</div>
<div class="form-actions">
<a class="button secondary" th:href="@{/animais}">Voltar</a>
<button class="button">Salvar e continuar →</button>
</div>
</form>
</section>
<footer>FutureVet · Cuidado que acompanha a vida.</footer>
</main>
</body>
</html>
