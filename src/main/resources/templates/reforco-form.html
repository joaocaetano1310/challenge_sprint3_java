<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Registrar reforço')}">
</head>
<body>
<aside th:replace="~{layout :: nav}">
</aside>
<main class="main">
<div th:replace="~{layout :: alerts}">
</div>
<header class="page-header">
<div>
<div class="eyebrow">PREVENÇÃO QUE CONTINUA</div>
<h1>Registrar reforço</h1>
<p th:text="${dose.nome}+' · '+${dose.animal}">
</p>
</div>
</header>
<section class="panel form-panel">
<p>O registro anterior será preservado. A próxima dose será calculada a partir do intervalo informado pelo veterinário.</p>
<form th:action="@{/vacinas/{id}/reforco(id=${dose.id})}" method="post" th:object="${form}">
<div th:replace="~{layout :: errors}">
</div>
<div class="form-grid">
<label>Data de aplicação do reforço<input type="date" th:field="*{data}" required>
</label>
<label>Intervalo até a próxima dose (meses)<input type="number" th:field="*{intervalo}" required min="1" max="60">
</label>
<label>Local de vacinação<input type="text" th:field="*{local}" required maxlength="100">
</label>
</div>
<div class="form-actions">
<a class="button secondary" th:href="@{/vacinas}">Voltar</a>
<button class="button">Registrar e calcular próxima dose →</button>
</div>
</form>
</section>
<footer>FutureVet · Cuidado que acompanha a vida.</footer>
</main>
</body>
</html>
